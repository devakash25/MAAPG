version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: maapg-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: maapg
      POSTGRES_PASSWORD: maapg_secret
      POSTGRES_DB: maapg_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maapg -d maapg_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maapg-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --requirepass maapg_redis_secret
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'maapg_redis_secret', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
